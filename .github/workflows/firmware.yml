name: firmware build

# Build the ESP32 firmware when source changes. Reads FW_VERSION from
# src/main.cpp; if the matching binary isn't already in the repo, builds
# it, commits firmware-<VERSION>.bin + an updated latest.json back to main,
# and creates a GitHub Release v<VERSION> with the .bin attached.
#
# Devices follow the committed latest.json on raw.githubusercontent.com and
# pull the committed firmware-<VERSION>.bin from the same place. The release
# is human-facing — changelog + download UI — not what the device fetches.
#
# To cut a release: bump FW_VERSION in src/main.cpp, commit, push.

on:
  push:
    branches: [main]
    # Only trigger when something that actually affects the build changes.
    # Implicitly excludes our own commit-backs (website/static/firmware/**,
    # ci-debug/**) because neither matches these globs. GitHub rejects the
    # run if you specify both `paths` and `paths-ignore`, so don't.
    paths:
      - 'src/**'
      - 'platformio.ini'
      - '.github/workflows/firmware.yml'
  workflow_dispatch: {}     # manual trigger from the Actions tab

permissions:
  contents: write           # needs to commit the .bin + create the release

concurrency:
  group: firmware-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so we can commit back without a shallow clone.
          fetch-depth: 0
          persist-credentials: true

      - name: Read FW_VERSION from src/main.cpp
        id: ver
        run: |
          v=$(grep -oP 'FW_VERSION\s*=\s*"\K[^"]+' src/main.cpp)
          if [ -z "$v" ]; then
            echo "::error::could not parse FW_VERSION from src/main.cpp"; exit 1
          fi
          echo "version=$v"            >> "$GITHUB_OUTPUT"
          echo "bin_name=firmware-$v.bin" >> "$GITHUB_OUTPUT"

      - name: Check if this version is already published
        id: gate
        run: |
          if [ -f "website/static/firmware/${{ steps.ver.outputs.bin_name }}" ]; then
            echo "already=true"  >> "$GITHUB_OUTPUT"
            echo "FW_VERSION ${{ steps.ver.outputs.version }} already published; skipping build."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.already == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        if: steps.gate.outputs.already == 'false'
        run: pip install --upgrade platformio

      - name: Cache PlatformIO packages
        if: steps.gate.outputs.already == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      # src/secrets.h is gitignored (WiFi credentials live there). Write a copy
      # from GitHub Actions secrets before building. Set these via the repo's
      # Settings → Secrets and variables → Actions:
      #
      #   PT_DEV_SSID       — primary WiFi network the device tries first
      #   PT_DEV_PASS       — its password
      #   PT_FALLBACK_SSID  — secondary WiFi (e.g. pool's network)
      #   PT_FALLBACK_PASS  — secondary password; leave unset for OPEN network
      #
      # If PT_DEV_SSID isn't set we fail early — building with stub credentials
      # would produce a binary that bricks the device on update (wifi never
      # connects, no way to reach for next OTA).
      - name: Provision src/secrets.h from GitHub Secrets
        id: provision
        if: steps.gate.outputs.already == 'false'
        env:
          PT_DEV_SSID:       ${{ secrets.PT_DEV_SSID }}
          PT_DEV_PASS:       ${{ secrets.PT_DEV_PASS }}
          PT_FALLBACK_SSID:  ${{ secrets.PT_FALLBACK_SSID }}
          PT_FALLBACK_PASS:  ${{ secrets.PT_FALLBACK_PASS }}
        run: |
          if [ -z "$PT_DEV_SSID" ]; then
            echo "::error::Repo secret PT_DEV_SSID is not set. Add the four WiFi secrets in Settings → Secrets and variables → Actions before CI can build a publishable firmware." >&2
            exit 1
          fi
          # FALLBACK_PASS empty => nullptr (open network)
          if [ -z "$PT_FALLBACK_PASS" ]; then
            fb_pass_literal='nullptr'
          else
            fb_pass_literal="\"$PT_FALLBACK_PASS\""
          fi
          cat > src/secrets.h <<HEADER
          // GENERATED BY GITHUB ACTIONS — do not commit. Source: repo Secrets.
          #pragma once
          static const char* DEV_SSID      = "$PT_DEV_SSID";
          static const char* DEV_PASS      = "$PT_DEV_PASS";
          static const char* FALLBACK_SSID = "${PT_FALLBACK_SSID:-pool-public}";
          static const char* FALLBACK_PASS = $fb_pass_literal;
          HEADER
          # echo a redacted view so we can see the file structure in logs
          # without leaking the actual values.
          sed -E 's/"[^"]*"/"***"/g' src/secrets.h

      - name: Build firmware
        id: build
        if: steps.gate.outputs.already == 'false'
        run: |
          set -o pipefail
          pio run -v -e esp32dev 2>&1 | tee /tmp/pio-build.log

      - name: Upload build log on failure
        if: always() && steps.gate.outputs.already == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: pio-build-log
          path: /tmp/pio-build.log
          if-no-files-found: ignore
          retention-days: 7

      # Public-readable fallback: artifact downloads need auth even on public
      # repos, so on build failure also commit the log to ci-debug/ on main.
      # Path filter excludes ci-debug/ from triggering, so no recursive runs.
      - name: Commit build log on failure (public via raw GitHub)
        if: failure() && steps.build.outcome == 'failure'
        run: |
          if [ ! -f /tmp/pio-build.log ]; then exit 0; fi
          mkdir -p ci-debug
          cp /tmp/pio-build.log "ci-debug/build-failure-${{ steps.ver.outputs.version }}-${{ github.run_id }}.log"
          cp /tmp/pio-build.log "ci-debug/last-failure.log"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-debug/
          git commit -m "ci: capture build failure ${{ steps.ver.outputs.version }} (run ${{ github.run_id }})"
          git push

      - name: Stage binary + manifest
        if: steps.gate.outputs.already == 'false' && steps.build.outcome == 'success'
        env:
          VERSION:  ${{ steps.ver.outputs.version }}
          BIN_NAME: ${{ steps.ver.outputs.bin_name }}
        run: |
          mkdir -p website/static/firmware
          cp .pio/build/esp32dev/firmware.bin "website/static/firmware/$BIN_NAME"
          size=$(stat -c%s "website/static/firmware/$BIN_NAME")
          released_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > website/static/firmware/latest.json <<JSON
          {
            "version": "$VERSION",
            "url": "https://raw.githubusercontent.com/${{ github.repository }}/main/website/static/firmware/$BIN_NAME",
            "size_bytes": $size,
            "released_at": "$released_at",
            "notes": "Built by GitHub Actions from ${{ github.sha }}"
          }
          JSON
          echo "--- latest.json ---"
          cat website/static/firmware/latest.json

      - name: Commit binary + manifest back to main
        if: steps.gate.outputs.already == 'false' && steps.build.outcome == 'success'
        env:
          VERSION:  ${{ steps.ver.outputs.version }}
          BIN_NAME: ${{ steps.ver.outputs.bin_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "website/static/firmware/$BIN_NAME" website/static/firmware/latest.json
          if git diff --staged --quiet; then
            echo "Nothing to commit (binary may match an existing build)."
          else
            git commit -m "ci: publish firmware $VERSION

          Built from ${GITHUB_SHA::10}. See release v$VERSION for changelog."
            git push
          fi

      - name: Create GitHub Release
        if: steps.gate.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION:  ${{ steps.ver.outputs.version }}
          BIN_NAME: ${{ steps.ver.outputs.bin_name }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; skipping create."
            exit 0
          fi
          gh release create "v$VERSION" \
            "website/static/firmware/$BIN_NAME" \
            --title "firmware $VERSION" \
            --notes "ESP32 firmware $VERSION

          Binary committed at \`website/static/firmware/$BIN_NAME\`. Devices
          pick this up automatically via the \`latest.json\` manifest on
          \`raw.githubusercontent.com\`."
